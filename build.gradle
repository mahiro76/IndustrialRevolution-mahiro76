plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url 'https://maven.aliyun.com/nexus/content/groups/public'
	}
	maven {
		url 'https://repository.hanbings.io/proxy'
	}
	//在此处添加存储库以检索构件。
	//你应该只在依赖其他 Mod 时使用它，因为
	//Loom 添加了必要的 maven 存储库，以自动从 Minecraft 和库下载。
	//查看 https://docs.gradle.org/current/userguide/declaring_repositories.html
	//了解有关存储库的更多信息。
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

processResources {
	inputs.property "version", project.version

	filesMatching("src/main/resources/fabric.mod.json") {
		expand "version": project.version
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

modrinth {//modrinth自动发布任务
	token = System.getenv("MODRINTH_TOKEN") // 请记住设置 MODRINTH_TOKEN 环境变量，否则会失败 - 只需确保它保持私有即可！
	projectId = "industrial-revolution-mahiro76" // 这可以是项目 ID 或 slug。两者都可以！
	versionName = "IndustrialRevolution-mahiro76 "+version // Modrinth版本描述。
	versionNumber = version // 您无需手动设置。如果 Modrinth 已经有这个版本，将失败
	changelog = "Modify the way to obtain orange seeds and add natural generation logic.(#ToDo)"//更新日志（英文！）；支持 Markdown 格式
	versionType = "beta" // 这是默认值 -- 也可以是 'beta' 或 'alpha'（正式版为release）
	uploadFile = jar // 对于 Loom，必须将其设置为 'remapJar' 而不是 'jar'！
	gameVersions = ["1.20.1"] // 必须是一个数组，即使只有一个版本
	loaders = ["fabric"] // 还必须是一个数组 - 如果您使用的是 Loom 或 ForgeGradle，则无需指定此数组
	dependencies { // 用于创建依赖项的特殊 DSL
		// scope.type
		// 范围可以是 'required'、'optional'、'incompatible' 或 'embedded'
		// 类型可以是 'project' 或 'version'
		required.project "fabric-api" // 在 Fabric API 上创建新的必需依赖项
	}

}



